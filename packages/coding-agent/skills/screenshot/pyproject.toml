[project]
name = "prime-agent-skill-screenshot"
version = "0.1.0"
description = "Capture the screen, a monitor, a window, or a region on native Windows and attach it to the model's context."
requires-python = ">=3.10"
dependencies = ["pillow>=10.0.0", "prime-agent-runtime"]

[project.scripts]
screenshot = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screenshot"]
