[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "short-swe-verified"
version = "0.1.10"
description = "the fixed 15-task SWE-bench Verified slice graded in a fresh network-free verifier"
requires-python = ">=3.12"
dependencies = [
    "verifiers[harbor]>=0.3.1",
]
tags = ["multi-turn", "sandbox", "harbor", "v1", "swe"]

[tool.hatch.build.targets.wheel]
packages = ["short_swe_verified"]
