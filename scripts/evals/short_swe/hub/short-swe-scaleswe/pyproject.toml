[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "short-swe-scaleswe"
version = "0.1.9"
description = "the fixed 5-task Scale-SWE slice"
requires-python = ">=3.12"
dependencies = [
    "verifiers[harbor]>=0.3.1",
]
tags =  ["multi-turn", "sandbox", "v1", "swe"]

[tool.hatch.build.targets.wheel]
packages = ["short_swe_scaleswe"]
